# Render Blueprint: one web service (API + built client) + managed Postgres.
databases:
  - name: gamehub-db
    plan: free
    databaseName: gamehub
    user: gamehub

services:
  - type: web
    name: game-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gamehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # set to your public URL, e.g. https://game-hub.onrender.com
